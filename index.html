<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hämplingens samfällighetsförening</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .card {
      background: white;
      padding: 48px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 2.2rem;
      line-height: 1.2;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .contact {
      margin-top: 36px;
      padding-top: 28px;
      border-top: 1px solid #ddd;
    }

    .contact-item {
      margin-bottom: 18px;
    }

    .label {
      font-weight: bold;
    }

    a {
      color: #1769aa;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 28px;
      font-size: 0.9rem;
      color: #666;
    }

    @media (max-width: 600px) {
      .container {
        padding: 24px 14px;
      }

      .card {
        padding: 28px 22px;
      }

      h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>Hämplingens samfällighetsförening</h1>

      <p>
        Välkommen till Hämplingens samfällighetsförening.
      </p>

      <p>
        Här hittar du kontaktuppgifter till föreningen.
      </p>

      <div class="contact">

        <div class="contact-item">
          <div class="label">Styrelsen</div>
          <a href="mailto:styrelse@hamplingensf.se">
            styrelse@hamplingensf.se
          </a>
        </div>

        <div class="contact-item">
          <div class="label">Ekonomiska frågor</div>
          <a href="mailto:kassor@hamplingensf.se">
            kassor@hamplingensf.se
          </a>
        </div>

      </div>

      <footer>
        Hämplingens samfällighetsförening
      </footer>

    </div>
  </div>

</body>
</html>
